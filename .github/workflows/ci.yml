name: CI

# Builds and tests every app. Runs on pull requests and pushes, and is reused by the
# server deploy workflow so nothing deploys unless this passes.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: api/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test

  worker:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: worker/package-lock.json }
      - name: Install qpdf (used by the command-safety tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qpdf
      - run: npm ci
      - run: npm run build
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.freenoo.com/api/v1

  news-admin:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: news-admin } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: news-admin/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      # Build only — placeholder values; nothing connects to a real database or service.
      - run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:1/ci-build-only
          JWT_SECRET: ci-build-only
          NEWS_AUTOMATION_ENABLED: 'false'
